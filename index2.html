<!DOCTYPE html>
<html lang="ja" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ray AI-Marketing Consulting | 和田 明</title>
    <meta name="description" content="実働型DXコンサルタント / SNS運用ディレクター 和田明のポートフォリオ。AIの機動力と人間の責任を融合させ、運に頼らない『科学的な成長』を伴走します。">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&family=Noto+Serif+JP:wght@300;400;600;700&family=Nunito:wght@300;400;600;700;800;900&family=Quicksand:wght@400;500;600;700&family=Caveat:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- React & Tailwind -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans JP"', 'sans-serif'],
                        serif: ['"Noto Serif JP"', 'serif'],
                        en: ['"Nunito"', 'sans-serif'],
                        display: ['"Quicksand"', 'sans-serif'],
                        handwriting: ['"Caveat"', 'cursive'],
                    },
                    colors: {
                        warm: {
                            50: '#FFF7ED',
                            100: '#FFEDD5',
                            200: '#FED7AA',
                            300: '#FDBA74',
                            400: '#FB923C',
                            500: '#F97316',
                            600: '#EA580C',
                            700: '#C2410C',
                            800: '#9A3412',
                            900: '#7C2D12',
                        },
                        cream: {
                            50: '#FEFDFB',
                            100: '#FDF8F3',
                            200: '#FBF0E4',
                            300: '#F8E8D5',
                            400: '#F4DFC3',
                        },
                        soft: {
                            gray: '#6B7280',
                            brown: '#78716C',
                            text: '#374151',
                        }
                    },
                    animation: {
                        'gentle-float': 'gentleFloat 8s ease-in-out infinite',
                        'gentle-pulse': 'gentlePulse 4s ease-in-out infinite',
                        'fade-in': 'fadeIn 1.2s ease-out forwards',
                        'fade-out': 'fadeOut 0.8s ease-out forwards',
                        'slide-up': 'slideUp 1s ease-out forwards',
                        'scale-in': 'scaleIn 1s ease-out forwards',
                        'warm-shimmer': 'warmShimmer 3s linear infinite',
                        'pan-gentle': 'panGentle 30s ease-in-out infinite alternate',
                    },
                    keyframes: {
                        gentleFloat: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-15px)' },
                        },
                        gentlePulse: {
                            '0%, 100%': { opacity: '1', transform: 'scale(1)' },
                            '50%': { opacity: '0.8', transform: 'scale(1.05)' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        fadeOut: {
                            '0%': { opacity: '1' },
                            '100%': { opacity: '0' },
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(30px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        },
                        scaleIn: {
                            '0%': { transform: 'scale(0.9)', opacity: '0' },
                            '100%': { transform: 'scale(1)', opacity: '1' },
                        },
                        warmShimmer: {
                            '0%': { backgroundPosition: '-200% 0' },
                            '100%': { backgroundPosition: '200% 0' },
                        },
                        panGentle: {
                            '0%': { transform: 'scale(1.08) translateX(-3%)' },
                            '100%': { transform: 'scale(1.08) translateX(3%)' }
                        }
                    },
                    borderRadius: {
                        'xl': '1rem',
                        '2xl': '1.5rem',
                        '3xl': '2rem',
                    },
                    boxShadow: {
                        'warm': '0 10px 40px rgba(249, 115, 22, 0.15)',
                        'warm-lg': '0 20px 60px rgba(249, 115, 22, 0.2)',
                        'soft': '0 10px 40px rgba(0, 0, 0, 0.08)',
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            font-feature-settings: "palt";
            -webkit-font-smoothing: antialiased;
            letter-spacing: 0.03em;
            overflow-x: hidden;
            cursor: none;
            background: linear-gradient(135deg, #FFF7ED 0%, #FFEDD5 100%);
            color: #374151;
        }

        /* Friendly Custom Cursor */
        .cursor-dot,
        .cursor-outline {
            position: fixed;
            top: 0;
            left: 0;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            z-index: 9999;
            pointer-events: none;
            transition: width 0.3s ease, height 0.3s ease, background-color 0.3s ease;
        }
        .cursor-dot {
            width: 10px;
            height: 10px;
            background: linear-gradient(135deg, #F97316, #FB923C);
        }
        .cursor-outline {
            width: 40px;
            height: 40px;
            border: 2px solid rgba(249, 115, 22, 0.4);
        }
        body.hovering .cursor-outline {
            width: 60px;
            height: 60px;
            background-color: rgba(249, 115, 22, 0.1);
            border-color: #F97316;
        }

        html {
            scroll-behavior: smooth;
        }

        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: #FFF7ED;
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #F97316, #FB923C);
            border-radius: 5px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #F97316;
        }

        ::selection {
            background: #FB923C;
            color: #fff;
        }

        /* Warm Splash Screen */
        .splash-screen {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #FFF7ED 0%, #FFEDD5 50%, #FED7AA 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }

        .splash-logo {
            font-family: 'Quicksand', sans-serif;
            font-size: 8rem;
            font-weight: 800;
            letter-spacing: 0.1em;
            background: linear-gradient(135deg, #F97316 0%, #FB923C 50%, #FDBA74 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: warmShimmer 3s linear infinite, scaleIn 1s ease-out forwards;
        }

        @media (max-width: 768px) {
            .splash-logo {
                font-size: 4rem;
            }
        }

        /* Soft Reveal Animations */
        .fade-up {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 1s ease-out, transform 1s ease-out;
        }
        .fade-up.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .zoom-in {
            opacity: 0;
            transform: scale(0.96);
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        }
        .zoom-in.visible {
            opacity: 1;
            transform: scale(1);
        }

        .slide-left {
            opacity: 0;
            transform: translateX(-40px);
            transition: opacity 1s ease-out, transform 1s ease-out;
        }
        .slide-left.visible {
            opacity: 1;
            transform: translateX(0);
        }

        .slide-right {
            opacity: 0;
            transform: translateX(40px);
            transition: opacity 1s ease-out, transform 1s ease-out;
        }
        .slide-right.visible {
            opacity: 1;
            transform: translateX(0);
        }

        /* Warm Glass Effect */
        .warm-glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(249, 115, 22, 0.1);
            transition: all 0.4s ease;
        }

        .warm-glass:hover {
            background: rgba(255, 255, 255, 0.85);
            border-color: rgba(249, 115, 22, 0.3);
            box-shadow: 0 15px 50px rgba(249, 115, 22, 0.15);
        }

        /* Gradient Text */
        .gradient-text {
            background: linear-gradient(135deg, #F97316 0%, #FB923C 50%, #FDBA74 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: warmShimmer 4s linear infinite;
        }

        /* Soft Number Watermark */
        .section-number {
            font-family: 'Quicksand', sans-serif;
            font-size: 11rem;
            font-weight: 800;
            color: rgba(249, 115, 22, 0.04);
            line-height: 1;
            user-select: none;
        }

        @media (max-width: 768px) {
            .section-number {
                font-size: 6rem;
            }
            body {
                cursor: auto;
            }
            .cursor-dot,
            .cursor-outline {
                display: none;
            }
        }

        /* Friendly Border */
        .friendly-border {
            position: relative;
            border-radius: 1.5rem;
            overflow: hidden;
        }
        .friendly-border::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 1.5rem;
            padding: 3px;
            background: linear-gradient(135deg, #F97316, #FB923C, #FDBA74);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .friendly-border:hover::before {
            opacity: 0.6;
        }

        /* Design Grid */
        .design-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
        }

        @media (min-width: 768px) {
            .design-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 1024px) {
            .design-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        /* Handwriting Style */
        .handwriting {
            font-family: 'Caveat', cursive;
            font-size: 1.5rem;
            color: #F97316;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        
        // --- Icons (同じアイコンコンポーネントを使用) ---
        const Icon = ({ children, size = 24, className = "", ...props }) => (
            <svg 
                xmlns="http://www.w3.org/2000/svg" 
                width={size} 
                height={size} 
                viewBox="0 0 24 24" 
                fill="none" 
                stroke="currentColor" 
                strokeWidth="2" 
                strokeLinecap="round" 
                strokeLinejoin="round" 
                className={className} 
                {...props}
            >
                {children}
            </svg>
        );

        const Menu = (props) => <Icon {...props}><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></Icon>;
        const X = (props) => <Icon {...props}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></Icon>;
        const ArrowRight = (props) => <Icon {...props}><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></Icon>;
        const Brain = (props) => <Icon {...props}><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"/></Icon>;
        const Layers = (props) => <Icon {...props}><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></Icon>;
        const Heart = (props) => <Icon {...props}><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></Icon>;
        const Target = (props) => <Icon {...props}><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></Icon>;
        const Zap = (props) => <Icon {...props}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></Icon>;
        const Mail = (props) => <Icon {...props}><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></Icon>;
        const ChevronDown = (props) => <Icon {...props}><path d="m6 9 6 6 6-6"/></Icon>;
        const Search = (props) => <Icon {...props}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></Icon>;
        const FileText = (props) => <Icon {...props}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></Icon>;
        const Image = (props) => <Icon {...props}><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></Icon>;
        const Video = (props) => <Icon {...props}><path d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2" ry="2"/></Icon>;
        const TrendingUp = (props) => <Icon {...props}><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></Icon>;
        const Smile = (props) => <Icon {...props}><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" x2="9.01" y1="9" y2="9"/><line x1="15" x2="15.01" y1="9" y2="9"/></Icon>;
        const Coffee = (props) => <Icon {...props}><path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><line x1="6" x2="6" y1="2" y2="4"/><line x1="10" x2="10" y1="2" y2="4"/><line x1="14" x2="14" y1="2" y2="4"/></Icon>;

        // --- Splash Screen ---
        const SplashScreen = ({ onComplete }) => {
            useEffect(() => {
                const timer = setTimeout(() => {
                    const splash = document.querySelector('.splash-screen');
                    if (splash) {
                        splash.style.animation = 'fadeOut 1s ease-out forwards';
                        setTimeout(onComplete, 1000);
                    }
                }, 2500);

                return () => clearTimeout(timer);
            }, [onComplete]);

            return (
                <div className="splash-screen">
                    <div className="text-center">
                        <h1 className="splash-logo">RAY</h1>
                        <p className="text-warm-500 text-sm font-en font-bold tracking-[0.3em] uppercase mt-8 animate-fade-in" style={{animationDelay: '0.5s'}}>
                            AI-Marketing Consulting
                        </p>
                    </div>
                </div>
            );
        };

        // --- Custom Cursor ---
        const CustomCursor = () => {
            const dotRef = useRef(null);
            const outlineRef = useRef(null);

            useEffect(() => {
                const moveCursor = (e) => {
                    if (dotRef.current && outlineRef.current) {
                        dotRef.current.style.left = e.clientX + 'px';
                        dotRef.current.style.top = e.clientY + 'px';
                        
                        setTimeout(() => {
                            if (outlineRef.current) {
                                outlineRef.current.style.left = e.clientX + 'px';
                                outlineRef.current.style.top = e.clientY + 'px';
                            }
                        }, 50);
                    }
                };

                const handleMouseOver = (e) => {
                    if (e.target.closest('.hover-target, a, button')) {
                        document.body.classList.add('hovering');
                    }
                };

                const handleMouseOut = (e) => {
                    if (!e.relatedTarget || !e.relatedTarget.closest('.hover-target, a, button')) {
                        document.body.classList.remove('hovering');
                    }
                };

                document.addEventListener('mousemove', moveCursor);
                document.addEventListener('mouseover', handleMouseOver);
                document.addEventListener('mouseout', handleMouseOut);

                return () => {
                    document.removeEventListener('mousemove', moveCursor);
                    document.removeEventListener('mouseover', handleMouseOver);
                    document.removeEventListener('mouseout', handleMouseOut);
                };
            }, []);

            return (
                <>
                    <div ref={dotRef} className="cursor-dot"></div>
                    <div ref={outlineRef} className="cursor-outline"></div>
                </>
            );
        };

        // --- Scroll Reveal ---
        const useScrollReveal = () => {
            useEffect(() => {
                const elements = document.querySelectorAll('.fade-up, .zoom-in, .slide-left, .slide-right');
                
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('visible');
                        }
                    });
                }, {
                    threshold: 0.1,
                    rootMargin: '0px 0px -60px 0px'
                });

                elements.forEach(el => observer.observe(el));

                return () => observer.disconnect();
            }, []);
        };

        // --- Section Heading ---
        const SectionHeading = ({ number, title, subtitle, icon }) => (
            <div className="mb-16 relative">
                <div className="section-number absolute -top-12 left-0 md:-left-12 z-0 fade-up">
                    {number}
                </div>
                <div className="relative z-10 fade-up">
                    <div className="flex items-center gap-4 mb-6">
                        {icon && (
                            <div className="p-3 bg-warm-100 rounded-2xl">
                                {icon}
                            </div>
                        )}
                        <h2 className="text-4xl md:text-6xl font-display font-bold text-soft-text">
                            {title}
                        </h2>
                    </div>
                    <div className="w-20 h-1.5 bg-gradient-to-r from-warm-500 to-warm-300 rounded-full mb-4"></div>
                    <p className="text-warm-600 text-sm md:text-base font-en font-semibold tracking-wide">
                        {subtitle}
                    </p>
                </div>
            </div>
        );

        // --- Navigation ---
        const Navbar = () => {
            const [isOpen, setIsOpen] = useState(false);
            const [scrolled, setScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 30);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const navLinks = [
                { name: 'Profile', href: '#profile' },
                { name: 'Philosophy', href: '#philosophy' },
                { name: 'Service', href: '#service' },
                { name: 'Portfolio', href: '#portfolio' },
                { name: 'Contact', href: '#contact' },
            ];

            return (
                <nav className={`fixed w-full z-50 transition-all duration-500 ${scrolled ? 'bg-white/90 backdrop-blur-xl py-4 shadow-warm' : 'bg-transparent py-6'}`}>
                    <div className="container mx-auto px-6 flex justify-between items-center">
                        <a href="#" className="hover-target text-2xl md:text-3xl font-display font-bold tracking-wide flex items-center gap-2">
                            <span className="gradient-text">RAY</span>
                            <Coffee size={28} className="text-warm-500" />
                        </a>

                        <div className="hidden md:flex gap-6 items-center">
                            {navLinks.map((link) => (
                                <a 
                                    key={link.name} 
                                    href={link.href} 
                                    className="hover-target text-sm font-en font-semibold text-soft-text hover:text-warm-500 transition-colors duration-300"
                                >
                                    {link.name}
                                </a>
                            ))}
                            <a 
                                href="#contact" 
                                className="hover-target bg-gradient-to-r from-warm-500 to-warm-400 hover:from-warm-600 hover:to-warm-500 text-white px-6 py-3 rounded-full text-sm font-en font-bold shadow-warm hover:shadow-warm-lg transition-all duration-300"
                            >
                                Contact
                            </a>
                        </div>

                        <button className="md:hidden text-soft-text hover-target" onClick={() => setIsOpen(!isOpen)}>
                            {isOpen ? <X size={28} /> : <Menu size={28} />}
                        </button>
                    </div>

                    {isOpen && (
                        <div className="md:hidden absolute top-full left-0 w-full bg-white/95 backdrop-blur-xl border-b-2 border-warm-100 p-8 flex flex-col gap-6 shadow-warm">
                            {navLinks.map((link) => (
                                <a 
                                    key={link.name} 
                                    href={link.href} 
                                    onClick={() => setIsOpen(false)} 
                                    className="text-lg font-en font-semibold text-soft-text hover:text-warm-500 transition-colors"
                                >
                                    {link.name}
                                </a>
                            ))}
                            <a 
                                href="#contact" 
                                className="bg-gradient-to-r from-warm-500 to-warm-400 text-white px-6 py-4 rounded-full text-center font-en font-bold shadow-warm"
                            >
                                Contact
                            </a>
                        </div>
                    )}
                </nav>
            );
        };

        // --- Hero Section ---
        const Hero = () => {
            return (
                <section className="relative min-h-screen flex items-center justify-center overflow-hidden">
                    {/* Warm Background */}
                    <div className="absolute inset-0 z-0">
                        <img 
                            src="https://images.unsplash.com/photo-1501786223405-6d024d7c3b8d?auto=format&fit=crop&q=80&w=2400" 
                            alt="Warm Sunset Landscape" 
                            className="w-full h-full object-cover opacity-15 animate-pan-gentle"
                        />
                        <div className="absolute inset-0 bg-gradient-to-b from-cream-50/90 via-cream-100/95 to-warm-50/90"></div>
                        
                        {/* Floating Warm Elements */}
                        <div className="absolute top-20 right-10 w-24 h-24 bg-warm-200 rounded-full opacity-20 blur-2xl animate-gentle-float"></div>
                        <div className="absolute bottom-32 left-10 w-32 h-32 bg-warm-300 rounded-full opacity-20 blur-3xl animate-gentle-float" style={{animationDelay: '1s'}}></div>
                        <div className="absolute top-1/2 right-1/4 w-20 h-20 bg-warm-400 rounded-full opacity-15 blur-2xl animate-gentle-float" style={{animationDelay: '2s'}}></div>
                    </div>

                    <div className="container mx-auto px-6 relative z-10 pt-24 pb-16">
                        <div className="max-w-5xl mx-auto text-center">
                            <div className="fade-up mb-8">
