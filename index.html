<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { Menu, X, ArrowRight, Brain, Layers, Heart, TrendingUp, Mail, ExternalLink, ChevronDown } = lucide;

        // --- Components ---

        // Reveal Animation Component
        const Reveal = ({ children, delay = 0, className = "" }) => {
            const [isVisible, setIsVisible] = useState(false);
            const ref = useRef(null);

            useEffect(() => {
                const observer = new IntersectionObserver(
                    ([entry]) => {
                        if (entry.isIntersecting) {
                            setIsVisible(true);
                            observer.unobserve(entry.target);
                        }
                    },
                    { threshold: 0.1 }
                );
                if (ref.current) observer.observe(ref.current);
                return () => observer.disconnect();
            }, []);

            return (
                <div 
                    ref={ref} 
                    className={`transition-all duration-1000 ease-out transform ${isVisible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-12'} ${className}`}
                    style={{ transitionDelay: `${delay}ms` }}
                >
                    {children}
                </div>
            );
        };

        // Navigation
        const Navbar = () => {
            const [isOpen, setIsOpen] = useState(false);
            const [scrolled, setScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const navLinks = [
                { name: 'Philosophy', href: '#philosophy' },
                { name: 'Profile', href: '#profile' },
                { name: 'Works', href: '#works' },
                { name: 'Contact', href: '#contact' },
            ];

            return (
                <nav className={`fixed w-full z-50 transition-all duration-300 ${scrolled ? 'bg-navy-900/90 backdrop-blur-md py-4 shadow-lg' : 'bg-transparent py-6'}`}>

                            RAY <span className="text-warm-500">.</span>
                        </a>

                        {/* Desktop Menu */}
                        <div className="hidden md:flex gap-8 items-center">
                            {navLinks.map((link) => (
                                <a key={link.name} href={link.href} className="text-sm uppercase tracking-widest text-text-muted hover:text-warm-400 transition-colors">
                                    {link.name}
                                </a>
                            ))}
                            <a href="mailto:rosteljp@gmail.com" className="bg-warm-600 hover:bg-warm-500 text-white px-5 py-2 rounded-sm text-sm font-medium transition-colors">
                                CONTACT
                            </a>
                        </div>

                        {/* Mobile Toggle */}
                        <button className="md:hidden text-white" onClick={() => setIsOpen(!isOpen)}>
                            {isOpen ? <X size={24} /> : <Menu size={24} />}
                        </button>
                    </div>

                    {/* Mobile Menu */}
                    {isOpen && (
                        <div className="md:hidden absolute top-full left-0 w-full bg-navy-900 border-t border-white/10 p-6 flex flex-col gap-6 shadow-xl">
                            {navLinks.map((link) => (
                                <a key={link.name} href={link.href} onClick={() => setIsOpen(false)} className="text-lg font-serif-en text-white block">
                                    {link.name}
                                </a>
                            ))}
                        </div>
                    )}

            );

        // About / Profile Section
        const Profile = () => {

                <section id="profile" className="py-24 bg-navy-800/50">
                    <div className="container mx-auto px-6">
                        <div className="grid md:grid-cols-12 gap-12 items-center">
                            <div className="md:col-span-5 order-2 md:order-1">
                                <Reveal>
                                    <div className="relative">
                                        {/* Image Placeholder */}

        // Works Section

                    image: "https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&q=80&w=800"
                },

                    image: "https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&q=80&w=800"
