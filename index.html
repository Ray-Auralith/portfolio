<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ray AI-Marketing Consulting | 和田 明</title>
    <meta name="description" content="実働型DXコンサルタント / SNS運用ディレクター 和田明のポートフォリオ。AIの機動力と人間の責任を融合させ、運に頼らない『科学的な成長』を伴走します。">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&family=Noto+Serif+JP:wght@300;400;600;700&family=Jost:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Cinzel:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- React & Tailwind -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans JP"', 'sans-serif'],
                        serif: ['"Noto Serif JP"', 'serif'],
                        en: ['"Jost"', 'sans-serif'],
                        luxury: ['"Cinzel"', 'serif'],
                        elegant: ['"Cormorant Garamond"', 'serif'],
                        playfair: ['"Playfair Display"', 'serif'],
                    },
                    colors: {
                        brand: {
                            black: '#0A0E1A',
                            dark: '#141824',
                            darker: '#0D1117',
                            gold: '#D4AF37',
                            lightGold: '#F4E5C2',
                            darkGold: '#B8860B',
                            bronze: '#CD7F32',
                            gray: '#94A3B8',
                            white: '#F1F5F9',
                        }
                    },
                    animation: {
                        'shimmer': 'shimmer 3s linear infinite',
                        'fade-in': 'fadeIn 1.5s ease-out forwards',
                        'fade-in-slow': 'fadeIn 2.5s ease-out forwards',
                        'fade-out': 'fadeOut 1s ease-out forwards',
                        'pan-slow': 'panSlow 25s ease-in-out infinite alternate',
                        'float': 'float 6s ease-in-out infinite',
                        'glow-pulse': 'glowPulse 3s ease-in-out infinite',
                        'scale-in': 'scaleIn 1.2s cubic-bezier(0.77, 0, 0.175, 1) forwards',
                        'slide-up': 'slideUp 1s ease-out forwards',
                    },
                    keyframes: {
                        shimmer: {
                            '0%': { backgroundPosition: '-200% 0' },
                            '100%': { backgroundPosition: '200% 0' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        fadeOut: {
                            '0%': { opacity: '1' },
                            '100%': { opacity: '0' },
                        },
                        panSlow: {
                            '0%': { transform: 'scale(1.15) translateX(-5%) translateY(0)' },
                            '50%': { transform: 'scale(1.15) translateX(5%) translateY(-2%)' },
                            '100%': { transform: 'scale(1.15) translateX(-5%) translateY(0)' }
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-12px)' },
                        },
                        glowPulse: {
                            '0%, 100%': { boxShadow: '0 0 20px rgba(212, 175, 55, 0.3)' },
                            '50%': { boxShadow: '0 0 50px rgba(212, 175, 55, 0.6), 0 0 80px rgba(212, 175, 55, 0.3)' },
                        },
                        scaleIn: {
                            '0%': { transform: 'scale(0.8)', opacity: '0' },
                            '100%': { transform: 'scale(1)', opacity: '1' },
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(40px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        }
                    },
                }
            }
        }
    </script>
    
    <style>
        body {
            font-feature-settings: "palt";
            -webkit-font-smoothing: antialiased;
            letter-spacing: 0.05em;
            overflow-x: hidden;
            cursor: none;
            background-color: #0A0E1A;
            color: #F1F5F9;
        }

        /* Custom Cursor */
        .cursor-dot,
        .cursor-outline {
            position: fixed;
            top: 0;
            left: 0;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            z-index: 9999;
            pointer-events: none;
            transition: width 0.3s ease, height 0.3s ease, background-color 0.3s ease;
        }
        .cursor-dot {
            width: 8px;
            height: 8px;
            background-color: #D4AF37;
        }
        .cursor-outline {
            width: 40px;
            height: 40px;
            border: 1px solid rgba(212, 175, 55, 0.5);
        }
        body.hovering .cursor-outline {
            width: 70px;
            height: 70px;
            background-color: rgba(212, 175, 55, 0.15);
            border-color: #D4AF37;
            border-width: 2px;
        }

        html {
            scroll-behavior: smooth;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0A0E1A;
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #D4AF37, #B8860B);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #D4AF37;
        }

        ::selection {
            background: #D4AF37;
            color: #000;
        }

        /* Splash Screen */
        .splash-screen {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #0A0E1A 0%, #141824 50%, #0A0E1A 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }

        .splash-logo {
            font-family: 'Cinzel', serif;
            font-size: 8rem;
            font-weight: 800;
            letter-spacing: 0.2em;
            background: linear-gradient(135deg, #D4AF37 0%, #F4E5C2 50%, #D4AF37 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 3s linear infinite, scaleIn 1.2s cubic-bezier(0.77, 0, 0.175, 1) forwards;
        }

        @media (max-width: 768px) {
            .splash-logo {
                font-size: 4rem;
            }
        }

        /* Reveal Animations */
        .fade-up {
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 1s ease-out, transform 1s ease-out;
        }
        .fade-up.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .zoom-in {
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        }
        .zoom-in.visible {
            opacity: 1;
            transform: scale(1);
        }

        .slide-left {
            opacity: 0;
            transform: translateX(-60px);
            transition: opacity 1s ease-out, transform 1s ease-out;
        }
        .slide-left.visible {
            opacity: 1;
            transform: translateX(0);
        }

        .slide-right {
            opacity: 0;
            transform: translateX(60px);
            transition: opacity 1s ease-out, transform 1s ease-out;
        }
        .slide-right.visible {
            opacity: 1;
            transform: translateX(0);
        }

        .glass-panel {
            background: rgba(20, 24, 36, 0.4);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 175, 55, 0.15);
            transition: all 0.5s ease;
        }

        .glass-panel:hover {
            background: rgba(20, 24, 36, 0.6);
            border-color: rgba(212, 175, 55, 0.4);
        }

        .gradient-text {
            background: linear-gradient(135deg, #D4AF37 0%, #F4E5C2 50%, #D4AF37 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 4s linear infinite;
        }

        .section-number {
            font-family: 'Cinzel', serif;
            font-size: 12rem;
            font-weight: 800;
            color: rgba(212, 175, 55, 0.04);
            line-height: 1;
            user-select: none;
        }

        @media (max-width: 768px) {
            .section-number {
                font-size: 6rem;
            }
            body {
                cursor: auto;
            }
            .cursor-dot,
            .cursor-outline {
                display: none;
            }
        }

        /* Luxury Border Effect */
        .luxury-border {
            position: relative;
        }
        .luxury-border::before {
            content: '';
            position: absolute;
            inset: 0;
            padding: 2px;
            background: linear-gradient(135deg, #D4AF37, #F4E5C2, #D4AF37);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0.3;
            transition: opacity 0.3s ease;
        }
        .luxury-border:hover::before {
            opacity: 0.8;
        }

        /* Design Grid Styles */
        .design-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        @media (min-width: 768px) {
            .design-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 1024px) {
            .design-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        
        // --- Icons ---
        const Icon = ({ children, size = 24, className = "", ...props }) => (
            <svg 
                xmlns="http://www.w3.org/2000/svg" 
                width={size} 
                height={size} 
                viewBox="0 0 24 24" 
                fill="none" 
                stroke="currentColor" 
                strokeWidth="2" 
                strokeLinecap="round" 
                strokeLinejoin="round" 
                className={className} 
                {...props}
            >
                {children}
            </svg>
        );

        const Menu = (props) => <Icon {...props}><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></Icon>;
        const X = (props) => <Icon {...props}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></Icon>;
        const ArrowRight = (props) => <Icon {...props}><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></Icon>;
        const Brain = (props) => <Icon {...props}><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"/></Icon>;
        const Layers = (props) => <Icon {...props}><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></Icon>;
        const Heart = (props) => <Icon {...props}><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></Icon>;
        const Target = (props) => <Icon {...props}><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></Icon>;
        const Zap = (props) => <Icon {...props}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></Icon>;
        const Mail = (props) => <Icon {...props}><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></Icon>;
        const ChevronDown = (props) => <Icon {...props}><path d="m6 9 6 6 6-6"/></Icon>;
        const Search = (props) => <Icon {...props}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></Icon>;
        const FileText = (props) => <Icon {...props}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></Icon>;
        const Image = (props) => <Icon {...props}><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></Icon>;
        const Video = (props) => <Icon {...props}><path d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2" ry="2"/></Icon>;
        const TrendingUp = (props) => <Icon {...props}><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></Icon>;

        // --- Splash Screen ---
        const SplashScreen = ({ onComplete }) => {
            useEffect(() => {
                const timer = setTimeout(() => {
                    const splash = document.querySelector('.splash-screen');
                    if (splash) {
                        splash.style.animation = 'fadeOut 1s ease-out forwards';
                        setTimeout(onComplete, 1000);
                    }
                }, 2500);

                return () => clearTimeout(timer);
            }, [onComplete]);

            return (
                <div className="splash-screen">
                    <div className="text-center">
                        <h1 className="splash-logo">RAY</h1>
                        <p className="text-brand-gold text-sm font-en tracking-[0.3em] uppercase mt-8 animate-fade-in-slow" style={{animationDelay: '0.5s'}}>
                            AI-Marketing Consulting
                        </p>
                    </div>
                </div>
            );
        };

        // --- Custom Cursor ---
        const CustomCursor = () => {
            const dotRef = useRef(null);
            const outlineRef = useRef(null);

            useEffect(() => {
                const moveCursor = (e) => {
                    if (dotRef.current && outlineRef.current) {
                        dotRef.current.style.left = e.clientX + 'px';
                        dotRef.current.style.top = e.clientY + 'px';
                        
                        setTimeout(() => {
                            if (outlineRef.current) {
                                outlineRef.current.style.left = e.clientX + 'px';
                                outlineRef.current.style.top = e.clientY + 'px';
                            }
                        }, 50);
                    }
                };

                const handleMouseOver = (e) => {
                    if (e.target.closest('.hover-target, a, button')) {
                        document.body.classList.add('hovering');
                    }
                };

                const handleMouseOut = (e) => {
                    if (!e.relatedTarget || !e.relatedTarget.closest('.hover-target, a, button')) {
                        document.body.classList.remove('hovering');
                    }
                };

                document.addEventListener('mousemove', moveCursor);
                document.addEventListener('mouseover', handleMouseOver);
                document.addEventListener('mouseout', handleMouseOut);

                return () => {
                    document.removeEventListener('mousemove', moveCursor);
                    document.removeEventListener('mouseover', handleMouseOver);
                    document.removeEventListener('mouseout', handleMouseOut);
                };
            }, []);

            return (
                <>
                    <div ref={dotRef} className="cursor-dot"></div>
                    <div ref={outlineRef} className="cursor-outline"></div>
                </>
            );
        };

        // --- Scroll Reveal Hook ---
        const useScrollReveal = () => {
            useEffect(() => {
                const elements = document.querySelectorAll('.fade-up, .zoom-in, .slide-left, .slide-right');
                
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('visible');
                        }
                    });
                }, {
                    threshold: 0.1,
                    rootMargin: '0px 0px -80px 0px'
                });

                elements.forEach(el => observer.observe(el));

                return () => observer.disconnect();
            }, []);
        };

        // --- Section Heading ---
        const SectionHeading = ({ number, title, subtitle }) => (
            <div className="mb-20 relative">
                <div className="section-number absolute -top-16 left-0 md:-left-16 z-0 fade-up">
                    {number}
                </div>
                <div className="relative z-10 fade-up">
                    <h2 className="text-4xl md:text-6xl lg:text-7xl font-luxury font-bold text-white mb-6 tracking-wide">
                        {title}
                    </h2>
                    <div className="w-24 h-1 bg-gradient-to-r from-brand-gold to-brand-lightGold mb-6"></div>
                    <p className="text-brand-gold text-sm md:text-base tracking-[0.3em] font-en uppercase font-medium">
                        {subtitle}
                    </p>
                </div>
            </div>
        );

        // --- Navigation ---
        const Navbar = () => {
            const [isOpen, setIsOpen] = useState(false);
            const [scrolled, setScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const navLinks = [
                { name: 'Profile', href: '#profile' },
                { name: 'Philosophy', href: '#philosophy' },
                { name: 'Service', href: '#service' },
                { name: 'Portfolio', href: '#portfolio' },
                { name: 'Contact', href: '#contact' },
            ];

            return (
                <nav className={`fixed w-full z-50 transition-all duration-500 ${scrolled ? 'bg-brand-black/95 backdrop-blur-xl py-4 shadow-2xl border-b border-brand-gold/10' : 'bg-transparent py-6'}`}>
                    <div className="container mx-auto px-6 flex justify-between items-center">
                        <a href="#" className="hover-target text-2xl md:text-3xl font-luxury font-bold tracking-wider flex items-center gap-3">
                            <span className="gradient-text">RAY</span>
                        </a>

                        <div className="hidden md:flex gap-8 items-center">
                            {navLinks.map((link) => (
                                <a 
                                    key={link.name} 
                                    href={link.href} 
                                    className="hover-target text-xs font-en font-bold uppercase tracking-[0.25em] text-brand-gray hover:text-brand-gold transition-all duration-300"
                                >
                                    {link.name}
                                </a>
                            ))}
                            <a 
                                href="#contact" 
                                className="hover-target bg-transparent border-2 border-brand-gold hover:bg-brand-gold text-brand-gold hover:text-black px-7 py-3 text-xs font-en font-bold uppercase tracking-widest transition-all duration-300 shadow-lg hover:shadow-brand-gold/50"
                            >
                                Contact
                            </a>
                        </div>

                        <button className="md:hidden text-white hover-target" onClick={() => setIsOpen(!isOpen)}>
                            {isOpen ? <X size={28} /> : <Menu size={28} />}
                        </button>
                    </div>

                    {isOpen && (
                        <div className="md:hidden absolute top-full left-0 w-full bg-brand-black/98 backdrop-blur-xl border-b border-brand-gold/10 p-8 flex flex-col gap-6 shadow-2xl">
                            {navLinks.map((link) => (
                                <a 
                                    key={link.name} 
                                    href={link.href} 
                                    onClick={() => setIsOpen(false)} 
                                    className="text-lg font-en font-medium text-white hover:text-brand-gold transition-colors"
                                >
                                    {link.name}
                                </a>
                            ))}
                            <a 
                                href="#contact" 
                                className="border-2 border-brand-gold hover:bg-brand-gold text-brand-gold hover:text-black px-6 py-4 text-center font-en font-bold uppercase tracking-widest transition-all"
                            >
                                Contact
                            </a>
                        </div>
                    )}
                </nav>
            );
        };

        // --- Hero Section ---
        const Hero = () => {
            return (
                <section className="relative min-h-screen flex items-center justify-center overflow-hidden">
                    {/* Luxury Background with Slow Pan */}
                    <div className="absolute inset-0 z-0">
                        <img 
                            src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&q=80&w=2400" 
                            alt="Luxury Gold Network" 
                            className="w-full h-full object-cover opacity-12 animate-pan-slow"
                        />
                        <div className="absolute inset-0 bg-gradient-to-b from-brand-black/80 via-brand-black/95 to-brand-black"></div>
                        <div className="absolute inset-0 bg-gradient-to-r from-brand-gold/5 via-transparent to-brand-gold/5"></div>
                        
                        {/* Floating Gold Particles */}
                        <div className="absolute top-20 left-10 w-2 h-2 bg-brand-gold rounded-full opacity-30 animate-float"></div>
                        <div className="absolute top-40 right-20 w-3 h-3 bg-brand-gold rounded-full opacity-20 animate-float" style={{animationDelay: '1s'}}></div>
                        <div className="absolute bottom-32 left-1/4 w-2 h-2 bg-brand-gold rounded-full opacity-25 animate-float" style={{animationDelay: '2s'}}></div>
                        <div className="absolute bottom-48 right-1/3 w-3 h-3 bg-brand-gold rounded-full opacity-15 animate-float" style={{animationDelay: '1.5s'}}></div>
                    </div>

                    <div className="container mx-auto px-6 relative z-10 pt-24 pb-16">
                        <div className="max-w-6xl mx-auto text-center">
                            <div className="fade-up mb-10">
                                <div className="inline-flex items-center gap-3 border-2 border-brand-gold/50 px-8 py-3 bg-brand-gold/10 backdrop-blur-sm luxury-border">
                                    <Zap size={18} className="text-brand-gold" />
                                    <span className="text-brand-gold text-xs font-en font-bold tracking-[0.35em] uppercase">
                                        AI-Powered SNS Growth
                                    </span>
                                </div>
                            </div>
                            
                            <h1 className="text-5xl md:text-7xl lg:text-8xl xl:text-9xl font-black leading-[1.05] mb-12 fade-up" style={{transitionDelay: '100ms'}}>
                                <span className="block mb-4">
                                    SNS運用の<span className="gradient-text">『停滞』</span>を、
                                </span>
                                <span className="block mb-4 text-white">
                                    圧倒的なスピードと精度で
                                </span>
                                <span className="block text-white">
                                    突破する。
                                </span>
                            </h1>
                            
                            <div className="fade-up mb-16" style={{transitionDelay: '200ms'}}>
                                <p className="text-brand-gray text-xl md:text-2xl leading-relaxed mb-4">
                                    <span className="text-brand-gold font-bold">AIの機動力、人間の責任。</span>
                                </p>
                                <p className="text-brand-gray text-xl md:text-2xl leading-relaxed">
                                    運に頼らない『科学的な成長』を伴走する。
                                </p>
